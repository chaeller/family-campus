<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Campus</title>
<style>
:root{
  --bg:#f6f4ff; --card:#ffffff; --ink:#26233a; --muted:#6c6886; --line:#e4e0f5;
  --ok:#1f9d55; --okbg:#e3f7ea; --bad:#d64545; --badbg:#fde8e8;
  --accent:#6b4eff; --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
#app{max-width:820px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.7rem;margin:.2em 0 .1em}
h2{font-size:1.3rem;margin:.2em 0 .6em}
h3{font-size:1.08rem;margin:1.1em 0 .4em}
p{margin:.4em 0}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 0 var(--line),0 6px 22px rgba(60,40,140,.06);margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{cursor:pointer;border:none;text-align:start;font:inherit;color:inherit;border-radius:var(--radius);padding:16px;background:var(--card);box-shadow:0 2px 0 var(--line),0 6px 18px rgba(60,40,140,.06);border-top:6px solid var(--c);transition:transform .12s}
.mod:hover{transform:translateY(-2px)}
.mod .emo{font-size:2rem}
.mod b{display:block;font-size:1.08rem;margin:.2em 0}
.badge{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:99px;background:#efeafe;color:#4b36c9;margin-top:6px}
.btn{font:inherit;font-weight:600;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#fff;min-height:48px}
.btn.sec{background:#ece8fb;color:#3d2fa0}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 4px;min-height:auto}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar{height:10px;background:#e6e1fa;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.exlist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;font:inherit;background:#faf9ff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer;color:inherit}
.exlist button:hover{border-color:var(--accent)}
/* difficulty of a set (ADR-0020): ◆◆ badge, locked sets greyed out */
.tier{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:99px;background:#efeafe;color:#4b36c9;font-size:.78rem;letter-spacing:1px;vertical-align:middle;white-space:nowrap}
.exlist button.locked{opacity:.6;background:transparent;border-style:dashed}
.exlist button.locked:hover{border-color:var(--line)}
.tierup{font-weight:600;color:#2b8a3e}
.lockinfo{margin:-4px 0 8px;padding:8px 12px;border-radius:12px;background:#fff4e6;color:#8a4b00;font-size:.9rem}
.q{font-size:1.12rem;font-weight:600;margin-bottom:12px}
.q .hint{display:block;font-weight:400;font-size:.92rem;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:start;background:#faf9ff;border:2px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:inherit;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:#efeafe}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.done{border-color:var(--ok);background:var(--okbg);opacity:.75}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
input.txt{font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;width:100%;max-width:360px;background:#fff;color:inherit}
input.txt:focus{outline:none;border-color:var(--accent)}
input.txt.ok{border-color:var(--ok);background:var(--okbg)}
input.txt.bad{border-color:var(--bad);background:var(--badbg)}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.acc button{font:inherit;font-size:1.05rem;width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:inherit}
.tbl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.tbl .lab{font-weight:600;text-align:end}
.tbl .fix{font-size:.9rem;color:var(--bad)}
.tokens{display:flex;flex-wrap:wrap;gap:6px;font-size:1.12rem}
.tok{font:inherit;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:inherit}
.tok.sel{background:#fff1b8;border-color:#e0b400}
.tok.ok{background:var(--okbg);border-color:var(--ok)}
.tok.bad{background:var(--badbg);border-color:var(--bad)}
.tok.miss{border-color:var(--ok);border-style:dashed}
.orderans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:grid;gap:8px;margin-bottom:10px}
.orderans .opt::before{content:attr(data-n) ". ";font-weight:700;color:var(--accent)}
.fb{margin-top:16px;padding:14px;border-radius:14px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb b{font-size:1.1rem}
/* reporting a question (ADR-0019) */
.flagnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:8px 12px;border-radius:12px;background:#fff4e6;color:#8a4b00;font-size:.92rem}
.flagnote span{flex:1}
.reportlink{margin-top:10px;font-size:.9rem}
.report{margin-top:12px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card,#fff)}
.report .reasons{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.report .reasons .opt{min-height:40px;padding:8px 12px;flex:0 1 auto}
.report textarea{width:100%;min-height:64px;font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:transparent;color:inherit;box-sizing:border-box}
table.t{border-collapse:collapse;width:100%;font-size:.95rem;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top}
table.t th{background:#f1eefc}
.scroll{overflow-x:auto}
.tip{background:#fff8dc;border-inline-start:5px solid #f1c232;padding:10px 12px;border-radius:10px;margin:10px 0}
.key{background:#efeafe;border-inline-start:5px solid var(--accent);padding:10px 12px;border-radius:10px;margin:10px 0}
svg.geo{width:100%;max-width:520px;height:auto;background:#fffdf7;border:2px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.info{font-size:1rem;margin:8px 0;min-height:1.5em}
.stars{font-size:2.4rem;letter-spacing:4px}
.constr .stepTxt{min-height:3.2em;margin:8px 0}
.small{font-size:.88rem}
.sortlist{display:grid;gap:8px}
.sortrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.sortword{font-size:1.15rem;font-weight:700;min-width:110px}
.sortbtns{display:flex;gap:8px;flex:1}
.sortbtn{flex:1;min-height:46px;padding:8px 10px;text-align:center}
@media (max-width:520px){ .match{grid-template-columns:1fr 1fr;gap:6px} .opt{padding:10px;font-size:.95rem} body{font-size:16px} }
</style>
<script src="../../i18n.js"></script>
<script src="../../campus.js"></script>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================ Helpers ============================ */
const T = (k, p) => I18n.t(k, p);   // UI texts (i18n.js, loaded with campus.js)

const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a,n){ return shuffle(a.slice()).slice(0,n); }
const norm = s => String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\s*'\s*/g,"'").replace(/\s+/g," ").trim().replace(/\s*[.!?]+$/,"").trim();
const noAcc = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const store = { get(){ return Campus.progress(); }, set(d){ Campus.setProgress(d); } };


/* ============================ Modules & content ============================ */
/* content modules are inserted here by tools/build_page.py */
const MODULES = [];

/* ============================ Navigation ============================ */
let current = null; // {mod, set, qs, idx, right, wrong, skipped, pending}
function go(view, arg){ window.scrollTo(0,0); app.innerHTML=""; VIEWS[view](arg); }
function back(label, fn){ return h("button",{class:"btn ghost",onclick:fn},"← "+label); }

const VIEWS = {
 home(){
  const st = store.get();
  app.append(h("h1",null,T("quiz.hello")), h("p",{class:"muted"},T("quiz.intro")));
  const g = h("div",{class:"grid"});
  MODULES.forEach(m=>{
    const done = m.sets.filter(s=>st[s.id]).length;
    g.append(h("button",{class:"mod",style:"--c:"+m.c,onclick:()=>go("module",m)},
      h("div",{class:"emo"},m.emo), h("b",null,m.title), h("div",{class:"small muted"},m.desc),
      h("span",{class:"badge"}, T("quiz.done", {done, count: m.sets.length}))));
  });
  app.append(g);
 },
 module(m){
  const st = store.get();
  app.append(back(T("nav.homeShort"),()=>{ location.href="../../"; }), h("h1",null,m.emo+" "+m.title), h("p",{class:"muted"},m.desc));
  app.append(h("div",{class:"card"}, h("div",{class:"row"},
    h("div",{style:"flex:1"}, h("b",null,"📖 "+T("quiz.learnFirst")), h("div",{class:"small muted"},T("quiz.sheetHint"))),
    h("button",{class:"btn sec",onclick:()=>go("learn",m)},T("quiz.openSheet")))));
  const l = h("div",{class:"card exlist"}, h("h2",null,"✏️ "+T("quiz.practise")));
  m.sets.forEach(s=>{
    const r = st[s.id], missing = lockedBy(m, s, st), why = tierText(m, s, missing);
    const badge = tierOf(s) > 1 ? h("span",{class:"tier",title:why,"aria-label":why},"◆".repeat(tierOf(s))) : null;
    let info = null;
    const b = h("button",{class:missing.length?"locked":null,"aria-disabled":missing.length?"true":null,onclick:()=>{
        if (!missing.length) return startSet(m,s);
        // phones have no tooltip: a tap shows the conditions below the set
        if (info){ info.remove(); info = null; return; }
        info = h("div",{class:"lockinfo",role:"status"},"🔒 "+why); b.after(info);
      }},
      h("span",null,s.title, badge),
      h("span",{class:"small"}, missing.length ? "🔒" : r ? stars(r.best)+" "+I18n.percent(r.best/100)+" · "+I18n.number(r.runs)+"×" : T("tile.newShort")));
    l.append(b);
  });
  const rc = Campus.repeatCard(); if (rc) app.append(rc);
  app.append(l);
 },
 learn(m){
  app.append(back(m.title,()=>go("module",m)));
  const c = h("div",{class:"card",html:m.learn}); app.append(c);
  (typeof LEARN_HOOKS !== "undefined" ? LEARN_HOOKS : []).forEach(f => f(c));   // widgets in the summary sheet (from extensions)
  app.append(h("div",{class:"row"}, h("button",{class:"btn",onclick:()=>go("module",m)},T("quiz.practiseNow")+" ✏️")));
 },
 result(){
  const {mod,set,right,qs,wrong,skipped} = current;
  const count = qs.length - skipped;   // reported or skipped questions count neither as right nor as wrong
  if (!count){
    app.append(h("div",{class:"card",style:"text-align:center"}, h("h2",null,"🚩 "+T("result.nothingCounted")),
      h("div",{class:"row",style:"justify-content:center;margin-top:12px"}, h("button",{class:"btn sec",onclick:()=>go("module",mod)},T("nav.back")))));
    return;
  }
  const pct = Math.round(right/count*100);
  const st = store.get(); const prev = st[set.id];
  const wasLocked = mod.sets.filter(x => lockedBy(mod, x, st).length);
  st[set.id] = {best: Math.max(pct, prev?prev.best:0), runs:(prev?prev.runs:0)+1,
                full: Math.max(current.isRetry || set.id==="__repeat" ? 0 : pct, prev&&prev.full||0)}; store.set(st);
  const opened = wasLocked.filter(x => !lockedBy(mod, x, st).length);
  Campus.result(set, right, count, current.isRetry);
  const msg = pct===100?T("result.perfect")+" 🎉":pct>=80?T("result.great")+" 💪":pct>=50?T("result.good")+" 🙂":T("result.keepGoing")+" 🌱";
  app.append(h("div",{class:"card",style:"text-align:center"},
    h("div",{class:"stars"},stars(pct)), h("h2",null,msg),
    h("p",null,T("result.score", {right, count})+" ("+I18n.percent(pct/100)+")"),
    skipped ? h("p",{class:"small muted"},"🚩 "+T("result.notCounted", {count: skipped})) : null,
    opened.length ? h("p",{class:"tierup"},"🔓 "+T("tier.opened", {sets: opened.map(x=>x.title).join(", ")})) : null,
    h("div",{class:"row",style:"justify-content:center;margin-top:12px"},
      wrong.length ? h("button",{class:"btn",onclick:()=>runQuiz(mod,set,wrong.slice(),true)},"🔁 "+T("result.retryWrong", {count: wrong.length})) : null,
      h("button",{class:"btn sec",onclick:()=>startSet(mod,set)},T("result.again")),
      h("button",{class:"btn sec",onclick:()=>go("module",mod)},T("nav.back")))));
 }
};
/* difficulty (ADR-0020): a set with tier n > 1 opens when every set of the next lower tier of the tile
   has a best result of at least TIER_PASS percent */
const TIER_PASS = 80;
const tierOf = s => Math.max(1, parseInt(s.tier, 10) || 1);
function lowerSets(m, s){
  const below = m.sets.map(tierOf).filter(t => t < tierOf(s));
  if (!below.length) return [];
  const t = Math.max(...below);
  return m.sets.filter(x => tierOf(x) === t);
}
// only whole runs count (st[id].full), not a retry round of the mistakes
function lockedBy(m, s, st){ return lowerSets(m, s).filter(x => !(st[x.id] && st[x.id].full >= TIER_PASS)); }
function tierText(m, s, missing){
  const max = Math.max(...m.sets.map(tierOf)), head = T("tier.name", {n: tierOf(s), max});
  const need = lowerSets(m, s);
  if (!need.length) return head;
  return head + " · " + (missing.length ? T("tier.needs", {pct: I18n.percent(TIER_PASS/100), sets: missing.map(x=>x.title).join(", ")}) : T("tier.open"));
}
function stars(p){ const n = p>=90?3:p>=70?2:p>=40?1:0; return "★".repeat(n)+"☆".repeat(3-n); }
function startSet(m,s){ const qs = s.qs(); runQuiz(m,s, s.noShuffle?qs:shuffle(qs), false); }
function runQuiz(mod,set,qs,isRetry){ sendPending(); current={mod,set,qs,idx:0,right:0,wrong:[],skipped:0,pending:null,isRetry}; showQ(); }
// the answer is stored when the learner goes on, not at once: a reported question must not count (ADR-0019)
function sendPending(){
  const c = current; if (!c || !c.pending) return;
  const {q, ok} = c.pending; c.pending = null;
  Campus.answer(c.mod, c.set, q, ok, c.isRetry);
}
addEventListener("pagehide", sendPending);
// what the learner answered, read from the card (typed text, or the options marked wrong / chosen)
function givenAnswer(card){
  const mine = sel => [...card.querySelectorAll(sel)].filter(x=>!x.closest(".report"));   // not the report form itself
  const typed = mine("input.txt").map(i=>i.value.trim()).filter(Boolean);
  if (typed.length) return typed.join(" | ");
  return mine(".opt.bad,.opt.sel,.tok.sel,.tok.bad").map(b=>b.textContent.trim()).join(" | ");
}

function showQ(){
  window.scrollTo(0,0); app.innerHTML="";
  const c = current, q = c.qs[c.idx];
  app.append(h("div",{class:"top"},
    h("button",{class:"btn ghost",onclick:()=>{ if(confirmExit()){ sendPending(); go("module",c.mod);} }},"✕"),
    h("div",{class:"bar"}, h("i",{style:`width:${c.idx/c.qs.length*100}%`})),
    h("span",{class:"small muted"},(c.idx+1)+"/"+c.qs.length)));
  const card = h("div",{class:"card"});
  if (c.isRetry) card.append(h("div",{class:"small muted",style:"margin-bottom:6px"},"🔁 "+T("quiz.retryRound")));
  app.append(card);
  let finished = false, result = null;   // result: {ok} once answered
  const nextBtn = () => h("button",{class:"btn",onclick:next}, c.idx+1<c.qs.length?T("quiz.next")+" →":T("quiz.finish")+" 🏁");
  // the question no longer counts: not right, not wrong, not stored
  const uncount = () => {
    if (result){ c.pending = null; if (result.ok) c.right--; else c.wrong.splice(c.wrong.indexOf(q),1); }
    c.skipped++; finished = true;
  };
  if (Campus.flagged(c.set, q)) card.append(h("div",{class:"flagnote"}, h("span",null,"🚩 "+T("report.flagged")),
    h("button",{class:"btn sec",onclick:()=>{ if (!result || c.pending) uncount(); next(); }},T("report.skip"))));
  function openReport(){
    if (card.querySelector(".report")) return;
    let reason = null;
    const send = h("button",{class:"btn",disabled:true,onclick:async()=>{
      send.disabled = true;
      const given = givenAnswer(card);
      const sent = await Campus.report(c.set, q, {reason, note: note.value, given, ok: result ? result.ok : null, isRetry: c.isRetry});
      if (!sent){ send.disabled = false; box.querySelector(".err").hidden = false; return; }
      uncount();
      box.replaceChildren(h("b",null,"🙏 "+T("report.thanks")), h("div",{class:"small",style:"margin-top:4px"},T("report.notCounted")),
        h("div",{style:"margin-top:12px"}, nextBtn()));
      card.querySelectorAll(".reportlink,.flagnote").forEach(x=>x.remove());
      card.querySelectorAll("input,button.opt,button.tok,.fb .btn").forEach(x=>{ if (!box.contains(x)) x.disabled = true; });
    }},T("report.send"));
    const reasons = h("div",{class:"reasons"}, [["wrongSolution",T("report.wrongSolution")],["rightAnswer",T("report.rightAnswer")],["unclear",T("report.unclear")],["typo",T("report.typo")],["other",T("report.other")]].map(([r,label])=>{
      const b = h("button",{class:"opt",type:"button","data-reason":r,onclick:()=>{ reason = r; reasons.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b)); send.disabled = false; }},label);
      return b; }));
    // a comment without a reason: "something else" is chosen, so the report can be sent (and changed)
    const note = h("textarea",{maxlength:"1000",placeholder:T("report.notePlaceholder"),"aria-label":T("report.note"),
      oninput:()=>{ if (!reason && note.value.trim()) reasons.querySelector('[data-reason="other"]').click(); }});
    const box = h("div",{class:"report",role:"group","aria-label":T("report.title")},
      h("b",null,"🚩 "+T("report.title")), h("div",{class:"small muted",style:"margin-top:4px"},T("report.hint")),
      reasons, note, h("div",{class:"small err",style:"color:var(--bad);margin-top:6px",hidden:true},T("report.failed")),
      h("div",{class:"row",style:"margin-top:10px;gap:10px"}, send, h("button",{class:"btn ghost",type:"button",onclick:()=>box.remove()},T("report.cancel"))));
    card.append(box);
    box.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  TYPES[q.t](q, card, (ok, sol)=>{
    if (finished) return; finished = true; result = {ok};
    if (ok) c.right++; else c.wrong.push(q);
    c.pending = {q, ok};
    card.querySelectorAll(":scope > .reportlink").forEach(x=>x.remove());   // the link moves into the feedback
    const fb = h("div",{class:"fb "+(ok?"ok":"bad")},
      h("b",null, ok?"✅ "+T("quiz.right"):"❌ "+T("quiz.notYet")),
      sol ? h("div",{html:sol,style:"margin-top:4px"}) : null,
      q.e ? h("div",{class:"small",style:"margin-top:6px",html:"💡 "+q.e}) : null,
      h("div",{style:"margin-top:12px"}, nextBtn()),
      h("div",{class:"reportlink"}, h("button",{class:"btn ghost",type:"button",onclick:openReport},"🚩 "+T("report.open"))));
    const open = card.querySelector(".report"); card.insertBefore(fb, open);   // a report opened before answering stays below
    fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  // before answering, too: a question that cannot be answered can be reported (and is then skipped)
  card.append(h("div",{class:"reportlink"}, h("button",{class:"btn ghost small",type:"button",onclick:openReport},"🚩 "+T("report.open"))));
}
function confirmExit(){ return true; }
function next(){ sendPending(); current.idx++; if (current.idx>=current.qs.length) go("result"); else showQ(); }

/* ============================ Question types ============================ */
// a row of keys that type a character into the input – for characters phone keyboards lack
function keyBar(chars, getInput){
  const bar = h("div",{class:"acc"});
  chars.forEach(ch=>{
    bar.append(h("button",{type:"button",onmousedown:e=>e.preventDefault(),onclick:()=>{
      const inp = getInput(); if (!inp || inp.disabled) return;
      const s = inp.selectionStart ?? inp.value.length, e2 = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0,s)+ch+inp.value.slice(e2); inp.focus(); inp.setSelectionRange(s+1,s+1);
    }},ch));
  });
  return bar;
}
const accentBar = getInput => keyBar("é è ê à â ç î ï ô û ù ë œ".split(" "), getInput);
// keys for maths answers: q.keys if the tile gives them, else a minus for every number question (the number
// pads of iPhones and of many Android keyboards have none; shown always, so that it does not give away the
// sign) and ^, ² ³ when an accepted answer contains them
function mathKeys(q, answers){
  if (Array.isArray(q.keys)) return q.keys;
  const all = answers.map(String);
  const keys = [];
  if (q.num) keys.push("−");
  for (const ch of ["^", "²", "³"]) if (all.some(a => a.includes(ch))) keys.push(ch);
  return keys;
}
// Typo tolerance (ADR-0008): one wrong, missing, extra or swapped character → one more try
function oneEdit(a, b){
  if (a === b || Math.abs(a.length - b.length) > 1) return false;
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (a.length === b.length) return a.slice(i + 1) === b.slice(i + 1) || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
  return a.length > b.length ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}
function looksLikeTypo(q, val, accepted){
  if (q.num || q.nospace || q.strict || q.fr) return false;
  const v = norm(val);
  return accepted.some(a => { const n = norm(a); return n.length >= 3 && !/\d/.test(n) && oneEdit(v, n); });
}
function typoCheck(q, inp, card, r){
  const hint = card.querySelector(".typo-hint");
  if (hint) { hint.remove(); if (r === "ok") card.append(h("div",{class:"small muted",style:"margin-top:8px"},"✍️ "+T("quiz.typoFixed"))); return false; }
  if (r !== "bad" || inp.dataset.typo || !looksLikeTypo(q, inp.value, q.a)) return false;
  inp.dataset.typo = "1";
  inp.insertAdjacentElement("afterend", h("div",{class:"typo-hint",role:"status",style:"margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff4e6;color:#8a4b00;font-weight:600"},
    "✍️ "+T("quiz.typoHint")));
  inp.focus();
  return true;
}
function checkText(val, accepted){
  const v = norm(val); const acc = accepted.map(norm);
  if (acc.includes(v)) return "ok";
  if (acc.map(noAcc).includes(noAcc(v)) && v) return "accent";
  return "bad";
}
const TYPES = {
 mc(q, card, finish){
  card.append(h("div",{class:"q",html:q.q}));
  if (q.svg) card.append(h("div",{html:q.svg,style:"margin-bottom:12px"}));
  const correct = q.o[0];
  const opts = h("div",{class:"opts"});
  shuffle(q.o.slice()).forEach(o=>{
    const b = h("button",{class:"opt",onclick:()=>{
      opts.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if (x.dataset.v===correct) x.classList.add("ok"); });
      const ok = o===correct; if (!ok) b.classList.add("bad");
      finish(ok, ok?"":T("quiz.correctIs")+" <b>"+correct+"</b>");
    }}, h("span",{html:o}));
    b.dataset.v = o; opts.append(b);
  });
  card.append(opts);
 },
 in(q, card, finish){
  card.append(h("div",{class:"q",html:q.q}));
  if (q.svg) card.append(h("div",{html:q.svg}));   // a figure for the question
  const inp = h("input",{class:"txt",type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false",placeholder:T("quiz.yourAnswer"),inputmode:q.num?"decimal":null});   // number pad for numbers
  const btn = h("button",{class:"btn",onclick:check},T("quiz.check"));
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
  card.append(inp);
  if (q.fr) card.append(accentBar(()=>inp));
  const keys = mathKeys(q, q.a || []);
  if (keys.length) card.append(keyBar(keys, ()=>inp));
  card.append(h("div",{style:"margin-top:10px"},btn));
  setTimeout(()=>inp.focus(),50);
  function check(){
    if (!inp.value.trim() || btn.disabled) return;
    // terms and equations ignore spaces and accept - · * ; numbers may carry a unit ("12 cm" → "12")
    const r = checkText(q.nospace ? inp.value.replace(/\s+/g,"").replace(/−/g,"-").replace(/[·*]/g,"") : (q.num ? inp.value.trim().replace(/\s*[^\d\s,.\-−][^\d]*$/,"") : inp.value), q.a);
    if (typoCheck(q, inp, card, r)) return;
    inp.disabled = true; btn.disabled = true;
    inp.classList.add(r==="ok"?"ok":"bad");
    const sol = q.sol || q.a[0];
    finish(r==="ok", r==="ok" ? "" : (r==="accent" ? T("quiz.accents")+" <b>"+sol+"</b>" : T("quiz.correctIs")+" <b>"+sol+"</b>"));
  }
 },
 table(q, card, finish){
  card.append(h("div",{class:"q",html:q.q}));
  const grid = h("div",{class:"tbl"}); let last=null; const inputs=[];
  q.rows.forEach(([lab])=>{
    const inp = h("input",{class:"txt",type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false",onfocus:e=>last=e.target});
    inputs.push(inp);
    grid.append(h("div",{class:"lab"},lab), inp, h("div",{class:"fix"}));
  });
  inputs.forEach((inp,i)=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ if(inputs[i+1]) inputs[i+1].focus(); else check(); }}));
  card.append(grid);
  if (q.fr) card.append(accentBar(()=>last||inputs[0]));
  const tkeys = mathKeys(q, q.rows.map(r => r[1]).flat());
  if (tkeys.length) card.append(keyBar(tkeys, ()=>last||inputs[0]));
  const btn = h("button",{class:"btn",onclick:check},T("quiz.check"));
  card.append(h("div",{style:"margin-top:10px"},btn));
  setTimeout(()=>inputs[0].focus(),50);
  function check(){
    if (btn.disabled) return;
    let all = true, accentOnly = false;
    q.rows.forEach(([lab,ans],i)=>{
      const r = checkText(inputs[i].value,[ans, lab.replace(/'$/,"")+(lab.endsWith("'")?"'":" ")+ans]);
      inputs[i].disabled = true; inputs[i].classList.add(r==="ok"?"ok":"bad");
      if (r!=="ok"){ all=false; if (r==="accent") accentOnly=true; grid.children[i*3+2].textContent = "→ "+ans; }
    });
    btn.disabled = true;
    finish(all, all?"":(accentOnly?T("quiz.tableAccents"):T("quiz.tableWrong")));
  }
 },
 match(q, card, finish){
  card.append(h("div",{class:"q",html:q.q}));
  const L = h("div",{class:"col"}), R = h("div",{class:"col"});
  card.append(h("div",{class:"match"},L,R));
  let selL=null, mistakes=0, done=0;
  const lb = shuffle(q.pairs.map((p,i)=>({i,t:p[0]}))), rb = shuffle(q.pairs.map((p,i)=>({i,t:p[1]})));
  lb.forEach(x=>{ const b=h("button",{class:"opt",onclick:()=>{ if(b.disabled)return; L.querySelectorAll(".opt").forEach(y=>y.classList.remove("sel")); b.classList.add("sel"); selL={x,b}; }},x.t); L.append(b); });
  rb.forEach(x=>{ const b=h("button",{class:"opt",onclick:()=>{
    if (b.disabled || !selL) return;
    if (selL.x.i===x.i){
      [selL.b,b].forEach(y=>{ y.classList.remove("sel"); y.classList.add("done"); y.disabled=true; });
      selL=null; done++;
      if (done===q.pairs.length) finish(mistakes<=1, mistakes? "Fehlversuche: "+mistakes : "");
    } else {
      mistakes++; const lbtn=selL.b;
      [lbtn,b].forEach(y=>y.classList.add("bad"));
      setTimeout(()=>[lbtn,b].forEach(y=>y.classList.remove("bad")),600);
    }
  }},x.t); R.append(b); });
  card.append(h("p",{class:"small muted",style:"margin-top:10px"},T("quiz.matchHint")));
 },
 order(q, card, finish){
  card.append(h("div",{class:"q",html:q.q+'<span class="hint">'+T("quiz.orderHint")+'</span>'}));
  const ans = h("div",{class:"orderans"}), pool = h("div",{class:"opts"});
  let order = shuffle(q.steps.map((s,i)=>i));
  if (order.every((v,i)=>v===i)) order.reverse();
  const chosen=[];
  const btn = h("button",{class:"btn",disabled:true,onclick:check},T("quiz.check"));
  function draw(){
    ans.innerHTML=""; pool.innerHTML="";
    chosen.forEach((i,k)=>{ const b=h("button",{class:"opt","data-n":k+1,onclick:()=>{ if(btn.dataset.done)return; chosen.splice(k,1); draw(); }},q.steps[i]); ans.append(b); });
    order.filter(i=>!chosen.includes(i)).forEach(i=>pool.append(h("button",{class:"opt",onclick:()=>{ chosen.push(i); draw(); }},q.steps[i])));
    btn.disabled = chosen.length!==q.steps.length;
  }
  card.append(ans,pool,h("div",{style:"margin-top:10px"},btn)); draw();
  function check(){
    btn.dataset.done="1"; btn.disabled=true;
    const ok = chosen.every((v,i)=>v===i);
    ans.querySelectorAll(".opt").forEach((b,k)=>{ b.disabled=true; b.classList.add(chosen[k]===k?"ok":"bad"); });
    finish(ok, ok?"":T("quiz.correctOrder")+"<ol style='margin:4px 0 0 0;padding-inline-start:20px'>"+q.steps.map(s=>"<li>"+s+"</li>").join("")+"</ol>");
  }
 },
 tap(q, card, finish){
  card.append(h("div",{class:"q",html:q.q}));
  const toks = q.s.split(" "), sel = new Set();
  const clean = t => t.replace(/[.,!?;:«»]/g,"").toLowerCase();
  const wrap = h("div",{class:"tokens"});
  const btns = toks.map((t,i)=>{ const b=h("button",{class:"tok",onclick:()=>{ if(b.disabled)return; sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle("sel"); }},t); wrap.append(b); return b; });
  const btn = h("button",{class:"btn",onclick:check},T("quiz.check"));
  card.append(wrap, h("div",{style:"margin-top:14px"},btn));
  function check(){
    btn.disabled=true;
    let ok=true;
    btns.forEach((b,i)=>{ b.disabled=true; const want=q.a.includes(clean(toks[i])); const has=sel.has(i);
      b.classList.remove("sel");
      if (want&&has) b.classList.add("ok"); else if (has&&!want){ b.classList.add("bad"); ok=false; } else if (want&&!has){ b.classList.add("miss"); ok=false; } });
    finish(ok, ok?"":(q.label||"Die Operatoren sind")+": <b>"+q.a.join(", ")+"</b>");
  }
 },
 sort(q, card, finish){
  card.append(h("div",{class:"q",html:q.q+'<span class="hint">'+T("quiz.sortHint")+'</span>'}));
  const items = shuffle(q.items.slice()); // sets often list the items per category: never show them in that order
  const choice = new Array(items.length).fill(null);
  const rows = h("div",{class:"sortlist"});
  const btn = h("button",{class:"btn",disabled:true,onclick:check},T("quiz.check"));
  const rowEls = items.map(([w],i)=>{
    const bs = q.cats.map(c=>h("button",{class:"opt sortbtn",onclick:()=>{ if(btn.dataset.done)return; choice[i]=c; bs.forEach(b=>b.classList.toggle("sel",b.textContent===c)); btn.disabled=choice.includes(null); }},c));
    const r = h("div",{class:"sortrow"}, h("div",{class:"sortword"},w), h("div",{class:"sortbtns"},bs));
    r._bs=bs; rows.append(r); return r;
  });
  card.append(rows, h("div",{style:"margin-top:12px"},btn));
  function check(){
    btn.dataset.done="1"; btn.disabled=true; let wrong=[];
    items.forEach(([w,cat],i)=>rowEls[i]._bs.forEach(b=>{ b.disabled=true;
      if (b.textContent===cat) b.classList.add(choice[i]===cat?"ok":"done");
      else if (b.textContent===choice[i]){ b.classList.remove("sel"); b.classList.add("bad"); wrong.push(w+" → "+cat); } }));
    finish(wrong.length===0, wrong.length? T("quiz.wouldBe")+" <b>"+wrong.join(" · ")+"</b>" : "");
  }
 },
 /* extra question types */
};

/* extensions of a tile (extra question types, summary-sheet widgets) are inserted here by tools/build_page.py */

Campus.start();
